<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Bill Calculator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .item-info {
      flex: 1;
    }

    .price {
      color: #666;
      font-size: 14px;
      margin-top: 3px;
    }

    input[type="number"] {
      width: 60px;
      padding: 7px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      background: #333;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #555;
    }

    #result {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 2px solid #333;
      display: none;
    }

    .bill-row {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Café Bill Calculator</h1>

    <div class="item">
      <div class="item-info">
        <strong>Chicken Rice</strong>
        <div class="price">$4.50</div>
      </div>
      <input type="number" id="chickenRice" min="0" value="0">
    </div>

    <div class="item">
      <div class="item-info">
        <strong>Nasi Lemak</strong>
        <div class="price">$4.00</div>
      </div>
      <input type="number" id="nasiLemak" min="0" value="0">
    </div>

    <div class="item">
      <div class="item-info">
        <strong>Laksa</strong>
        <div class="price">$5.00</div>
      </div>
      <input type="number" id="laksa" min="0" value="0">
    </div>

    <div class="item">
      <div class="item-info">
        <strong>Kopi</strong>
        <div class="price">$1.50</div>
      </div>
      <input type="number" id="kopi" min="0" value="0">
    </div>

    <div class="item">
      <div class="item-info">
        <strong>Teh</strong>
        <div class="price">$1.30</div>
      </div>
      <input type="number" id="teh" min="0" value="0">
    </div>

    <div class="item">
      <div class="item-info">
        <strong>Milo</strong>
        <div class="price">$2.00</div>
      </div>
      <input type="number" id="milo" min="0" value="0">
    </div>

    <button onclick="calculateBill()">Calculate Bill</button>

    <div id="result">
      <div id="billDetails"></div>

      <div class="bill-row total">
        <span>Total</span>
        <span id="totalAmount">$0.00</span>
      </div>
    </div>
  </div>

  <script>
    const menu = [
      { id: "chickenRice", name: "Chicken Rice", price: 4.50 },
      { id: "nasiLemak", name: "Nasi Lemak", price: 4.00 },
      { id: "laksa", name: "Laksa", price: 5.00 },
      { id: "kopi", name: "Kopi", price: 1.50 },
      { id: "teh", name: "Teh", price: 1.30 },
      { id: "milo", name: "Milo", price: 2.00 }
    ];

    function calculateBill() {
      let total = 0;
      let billHTML = "";

      menu.forEach(item => {
        const input = document.getElementById(item.id);
        const quantity = Math.max(0, parseInt(input.value) || 0);

        // Prevent negative quantities from affecting the bill
        input.value = quantity;

        if (quantity > 0) {
          const subtotal = quantity * item.price;
          total += subtotal;

          billHTML += `
            <div class="bill-row">
              <span>${item.name} × ${quantity}</span>
              <span>$${subtotal.toFixed(2)}</span>
            </div>
          `;
        }
      });

      if (billHTML === "") {
        billHTML = `
          <div class="bill-row">
            <span>No items selected</span>
            <span>$0.00</span>
          </div>
        `;
      }

      document.getElementById("billDetails").innerHTML = billHTML;
      document.getElementById("totalAmount").textContent =
        "$" + total.toFixed(2);

      document.getElementById("result").style.display = "block";
    }
  </script>

</body>
</html>
