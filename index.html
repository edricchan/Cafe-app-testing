<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Bill Calculator</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 40px 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .item-info {
      flex: 1;
    }

    .price {
      color: #666;
      font-size: 14px;
      margin-top: 3px;
    }

    input[type="number"] {
      width: 60px;
      padding: 7px;
      text-align: center;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 12px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      background: #333;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #555;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    #status {
      text-align: center;
      color: #666;
      padding: 20px 0;
    }

    #error {
      display: none;
      padding: 12px;
      margin-top: 15px;
      background: #f8dddd;
      border-radius: 6px;
      color: #8a1f1f;
    }

    #result {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 2px solid #333;
      display: none;
    }

    .bill-row {
      display: flex;
      justify-content: space-between;
      margin: 8px 0;
    }

    .total {
      font-size: 22px;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Café Bill Calculator</h1>

    <div id="status">Loading menu...</div>

    <div id="menu"></div>

    <div id="error"></div>

    <button id="calculateButton" onclick="calculateBill()" disabled>
      Calculate Bill
    </button>

    <div id="result">
      <div id="billDetails"></div>

      <div class="bill-row total">
        <span>Total</span>
        <span id="totalAmount">$0.00</span>
      </div>
    </div>
  </div>

  <script>
    let menu = [];

    async function loadMenu() {
      try {
        const response = await fetch("menu.csv");

        if (!response.ok) {
          throw new Error("Unable to load menu.csv");
        }

        const csvText = await response.text();
        const lines = csvText.trim().split(/\r?\n/);

        // Remove header row
        lines.shift();

        menu = lines
          .filter(line => line.trim() !== "")
          .map((line, index) => {
            const [name, price] = line.split(",");

            return {
              id: "item-" + index,
              name: name.trim(),
              price: parseFloat(price.trim())
            };
          })
          .filter(item =>
            item.name &&
            !isNaN(item.price)
          );

        if (menu.length === 0) {
          throw new Error("No valid menu items found.");
        }

        displayMenu();

        document.getElementById("status").style.display = "none";
        document.getElementById("calculateButton").disabled = false;

      } catch (error) {
        document.getElementById("status").style.display = "none";

        const errorBox = document.getElementById("error");
        errorBox.textContent =
          "Could not load the menu. Please make sure menu.csv is in the same folder as index.html.";
        errorBox.style.display = "block";
      }
    }

    function displayMenu() {
      const menuContainer = document.getElementById("menu");
      menuContainer.innerHTML = "";

      menu.forEach(item => {
        const itemElement = document.createElement("div");
        itemElement.className = "item";

        itemElement.innerHTML = `
          <div class="item-info">
            <strong>${escapeHtml(item.name)}</strong>
            <div class="price">$${item.price.toFixed(2)}</div>
          </div>

          <input
            type="number"
            id="${item.id}"
            min="0"
            step="1"
            value="0"
          >
        `;

        menuContainer.appendChild(itemElement);
      });
    }

    function calculateBill() {
      let total = 0;
      let billHTML = "";

      menu.forEach(item => {
        const input = document.getElementById(item.id);

        let quantity = parseInt(input.value);

        if (isNaN(quantity) || quantity < 0) {
          quantity = 0;
        }

        input.value = quantity;

        if (quantity > 0) {
          const subtotal = quantity * item.price;
          total += subtotal;

          billHTML += `
            <div class="bill-row">
              <span>${escapeHtml(item.name)} × ${quantity}</span>
              <span>$${subtotal.toFixed(2)}</span>
            </div>
          `;
        }
      });

      if (billHTML === "") {
        billHTML = `
          <div class="bill-row">
            <span>No items selected</span>
            <span>$0.00</span>
          </div>
        `;
      }

      document.getElementById("billDetails").innerHTML = billHTML;
      document.getElementById("totalAmount").textContent =
        "$" + total.toFixed(2);

      document.getElementById("result").style.display = "block";
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    loadMenu();
  </script>

</body>
</html>
